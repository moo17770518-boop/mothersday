<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>부모님께 전하는 감사 영상</title>
<style>
:root{--bg:#fff9f2;--card:#fff;--pink:#e96f8f;--pink2:#ffe1e8;--red:#c94c6d;--ink:#3c3434;--muted:#766b6b;--green:#5c8f76;--shadow:0 10px 28px rgba(90,50,50,.10)}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:linear-gradient(180deg,#fff8f1,#fffdf9);color:var(--ink);font-size:20px}.app{max-width:980px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-size:clamp(28px,5vw,44px);font-weight:900;margin:8px 0}.teacher{border:0;background:#fff;border-radius:16px;padding:13px 16px;font-weight:800;box-shadow:var(--shadow);cursor:pointer}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 24px}.stepdot{padding:12px 8px;text-align:center;border-radius:14px;background:#f1e9e5;font-weight:800;font-size:16px}.stepdot.active{background:var(--pink);color:white}.panel{background:rgba(255,255,255,.92);border-radius:28px;padding:clamp(18px,4vw,34px);box-shadow:var(--shadow);min-height:500px}.panel h2{font-size:clamp(27px,4vw,38px);margin:0 0 12px}.hint{color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.choice{position:relative;border:3px solid transparent;background:#fff7f8;border-radius:22px;padding:22px 54px 22px 18px;min-height:105px;font-size:21px;font-weight:850;text-align:left;cursor:pointer}.choice.selected{border-color:var(--pink);background:var(--pink2)}.speak{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:white;font-size:20px;cursor:pointer}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:18px;padding:17px 24px;font-size:21px;font-weight:900;cursor:pointer}.primary{background:var(--pink);color:white}.secondary{background:#eee5e1;color:var(--ink)}.btn:disabled{opacity:.4;cursor:not-allowed}.letter{background:#fff5f7;border:3px dashed #f2a2b5;border-radius:24px;padding:25px;font-size:clamp(22px,4vw,32px);font-weight:850;line-height:1.7;white-space:pre-line}.input{width:100%;font:inherit;border:3px solid #eadeda;border-radius:18px;padding:16px;margin-top:12px}.photoActions{display:flex;flex-wrap:wrap;gap:12px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.photo{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;background:#eee}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:7px;top:7px;border:0;border-radius:50%;width:36px;height:36px;background:#fff;font-size:18px}.record{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.story{background:linear-gradient(145deg,#fff0f3,#fffaf4);border-radius:28px;min-height:390px;padding:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.story img{max-width:100%;max-height:270px;border-radius:22px;object-fit:contain}.story .big{font-size:clamp(30px,6vw,52px);font-weight:950}.story .caption{font-size:clamp(22px,4vw,32px);font-weight:850;margin-top:18px;white-space:pre-line}.done{text-align:center;padding:30px}.done .flower{font-size:72px}.modal{position:fixed;inset:0;background:rgba(35,25,25,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modalbox{background:white;border-radius:26px;padding:24px;max-width:760px;width:100%;max-height:90vh;overflow:auto}.row{display:flex;gap:10px;margin:10px 0}.row input{flex:1}.small{font-size:16px}.confetti{position:fixed;top:-20px;font-size:25px;animation:fall linear forwards;z-index:30;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}.movieWrap{margin-top:18px}.movie{position:relative;overflow:hidden;background:#241f22;border-radius:28px;min-height:520px;display:flex;align-items:center;justify-content:center;text-align:center;color:white;box-shadow:var(--shadow)}.movie img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kenburns 6s ease-out both}.movie:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.52))}.movieContent{position:relative;z-index:2;padding:35px;width:100%}.movieBig{font-size:clamp(38px,8vw,72px);font-weight:950;text-shadow:0 3px 14px rgba(0,0,0,.35)}.movieCaption{font-size:clamp(24px,5vw,40px);font-weight:900;line-height:1.55;white-space:pre-line;text-shadow:0 3px 14px rgba(0,0,0,.6);margin-top:18px}.movieTime{position:absolute;z-index:3;right:18px;top:16px;background:rgba(0,0,0,.45);padding:7px 12px;border-radius:999px;font-weight:800}.movieProgress{height:12px;background:#eadeda;border-radius:999px;overflow:hidden;margin:14px 0}.movieProgress>div{height:100%;background:var(--pink);width:0}.movieControls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.movieNote{text-align:center;color:var(--muted);font-size:16px}.saveStatus{text-align:center;font-weight:800;color:var(--green);min-height:28px;margin:10px 0 0}.movie.playing .movieProgress>div{animation:moviebar 30s linear forwards}@keyframes moviebar{from{width:0}to{width:100%}}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}@media(max-width:650px){.grid{grid-template-columns:1fr}.progress{grid-template-columns:repeat(2,1fr)}.photos{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.teacher{font-size:14px}.app{padding:12px}.panel{border-radius:22px}.nav .btn{flex:1;padding:15px 10px;font-size:18px}}
</style>
</head>
<body><main class="app">
<div class="top"><div><div class="title">💐 부모님께 전하는 감사 영상</div></div><button class="teacher" id="teacherBtn">⚙️ 선생님 편집</button></div>
<div class="progress" id="progress"></div><section class="panel" id="panel"></section>
</main>
<div class="modal" id="teacherModal"><div class="modalbox"><h2>⚙️ 선생님 편집</h2><p class="hint small">학생이 고를 문장과 마지막 인사를 수정할 수 있어요. 이 설정은 이 브라우저에 저장됩니다.</p><div id="editor"></div><div class="nav"><button class="btn secondary" id="closeTeacher">닫기</button><button class="btn primary" id="saveTeacher">저장하기</button></div></div></div>
<script>
const defaults={thanks:["🍚 맛있는 밥을 해주셔서 감사해요.","🚗 데려다주셔서 감사해요.","🤗 항상 응원해주셔서 감사해요.","🏠 나를 돌봐주셔서 감사해요.","❤️ 많이 사랑해주셔서 감사해요."],closings:["❤️ 사랑해요!","😊 항상 건강하세요!","🌷 오래오래 함께해요!","👍 앞으로 더 잘할게요!"],opening:"엄마, 아빠!",last:"엄마, 아빠 사랑해요!\n감사합니다."};
let cfg=JSON.parse(localStorage.getItem('parentsThanksCfg')||'null')||structuredClone(defaults);let step=0,selected=[],closing=cfg.closings[0],customThanks='',customClosing='',photos=[],storyIndex=0,recorder=null,chunks=[],audioURL='',movieTimer=null,movieStart=0,movieAudio=null,downloadURL='';
const panel=document.getElementById('panel'),progress=document.getElementById('progress');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function speak(t){if(!('speechSynthesis'in window))return alert('이 기기에서는 음성 읽기를 사용할 수 없어요.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u)}
function renderProgress(){progress.innerHTML=['① 감사한 일','② 감사 편지','③ 사진·목소리','④ 영상'].map((x,i)=>`<div class="stepdot ${i===step?'active':''}">${x}</div>`).join('')}
function letter(){let arr=selected.map(i=>cfg.thanks[i]);if(customThanks.trim())arr.push(customThanks.trim());return `${cfg.opening}\n${arr.join('\n')}${arr.length?'\n':''}${customClosing.trim()||closing}`}
function render(){renderProgress(); if(step===0)step1();else if(step===1)step2();else if(step===2)step3();else if(step===3)step4();else done()}
function step1(){panel.innerHTML=`<h2>💗 부모님께 어떤 것이 고마운가요?</h2><p class="hint">고마운 일을 하나 이상 골라보세요.</p><div class="grid">${cfg.thanks.map((t,i)=>`<button class="choice ${selected.includes(i)?'selected':''}" data-i="${i}">${esc(t)}<span class="speak" data-speak="${i}">🔊</span></button>`).join('')}</div><input class="input" id="customThanks" placeholder="✏️ 직접 쓰기 (선택)" value="${esc(customThanks)}"><div class="nav"><span></span><button class="btn primary" id="next" ${selected.length||customThanks.trim()?'':'disabled'}>다음 ▶</button></div>`;panel.querySelectorAll('.choice').forEach(b=>b.onclick=e=>{if(e.target.dataset.speak!==undefined){e.stopPropagation();speak(cfg.thanks[+e.target.dataset.speak]);return}let i=+b.dataset.i;selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i];render()});let inp=document.getElementById('customThanks');inp.oninput=()=>{customThanks=inp.value;document.getElementById('next').disabled=!(selected.length||customThanks.trim())};document.getElementById('next').onclick=()=>{step=1;render()}}
function step2(){panel.innerHTML=`<h2>💌 감사 편지를 만들어요</h2><p class="hint">마지막 인사를 골라 편지를 완성해보세요.</p><div class="grid">${cfg.closings.map((t,i)=>`<button class="choice ${closing===t&&!customClosing?'selected':''}" data-c="${i}">${esc(t)}<span class="speak" data-s="${i}">🔊</span></button>`).join('')}</div><input class="input" id="customClosing" placeholder="✏️ 마지막 말을 직접 쓰기 (선택)" value="${esc(customClosing)}"><h3>완성된 편지</h3><div class="letter" id="letter">${esc(letter())}</div><div class="record"><button class="btn secondary" id="read">🔊 편지 읽어보기</button></div><div class="nav"><button class="btn secondary" id="prev">◀ 이전</button><button class="btn primary" id="next">다음 ▶</button></div>`;panel.querySelectorAll('[data-c]').forEach(b=>b.onclick=e=>{if(e.target.dataset.s!==undefined){e.stopPropagation();speak(cfg.closings[+e.target.dataset.s]);return}closing=cfg.closings[+b.dataset.c];customClosing='';render()});let inp=document.getElementById('customClosing');inp.oninput=()=>{customClosing=inp.value;document.getElementById('letter').textContent=letter()};document.getElementById('read').onclick=()=>speak(letter());document.getElementById('prev').onclick=()=>{step=0;render()};document.getElementById('next').onclick=()=>{step=2;render()}}
function step3(){panel.innerHTML=`<h2>📷 사진과 목소리를 준비해요</h2><p class="hint">사진은 이 기기에서만 사용하며 서버로 보내지 않아요. 최대 5장까지 선택할 수 있어요.</p><div class="photoActions"><label class="btn primary">📷 사진이나 동영상 추가하기<input id="file" type="file" accept="image/*" multiple hidden></label></div><div class="photos">${photos.map((p,i)=>`<div class="photo"><img src="${p}"><button data-del="${i}">✕</button></div>`).join('')}</div><hr style="border:0;border-top:2px solid #f0e5e2;margin:28px 0"><h3>🎤 내 목소리 녹음하기</h3><div class="record"><button class="btn primary" id="rec">🎤 녹음 시작</button><button class="btn secondary" id="stop" disabled>⏹ 녹음 끝</button>${audioURL?`<audio controls src="${audioURL}"></audio><button class="btn secondary" id="delAudio">🗑 삭제</button>`:''}</div><div class="nav"><button class="btn secondary" id="prev">◀ 이전</button><button class="btn primary" id="next">영상 미리보기 ▶</button></div>`;function addFiles(fs){[...fs].slice(0,5-photos.length).forEach(f=>{let r=new FileReader();r.onload=()=>{photos.push(r.result);render()};r.readAsDataURL(f)})}document.getElementById('file').onchange=e=>addFiles(e.target.files);panel.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{photos.splice(+b.dataset.del,1);render()});document.getElementById('rec').onclick=startRec;document.getElementById('stop').onclick=stopRec;if(document.getElementById('delAudio'))document.getElementById('delAudio').onclick=()=>{URL.revokeObjectURL(audioURL);audioURL='';render()};document.getElementById('prev').onclick=()=>{step=1;render()};document.getElementById('next').onclick=()=>{storyIndex=0;step=3;render()}}
async function startRec(){try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let blob=new Blob(chunks,{type:recorder.mimeType});audioURL=URL.createObjectURL(blob);stream.getTracks().forEach(t=>t.stop());render()};recorder.start();document.getElementById('rec').disabled=true;document.getElementById('stop').disabled=false}catch(e){alert('마이크 사용을 허용해 주세요. HTTPS 또는 localhost 환경에서 녹음이 동작할 수 있어요.')}}function stopRec(){if(recorder&&recorder.state!=='inactive')recorder.stop()}
function scenes(){let s=[{big:'🌷 어버이날',cap:'엄마, 아빠 사랑해요!'}];let msgs=selected.map(i=>cfg.thanks[i]);if(customThanks.trim())msgs.push(customThanks.trim());photos.forEach((p,i)=>s.push({img:p,cap:msgs[i%Math.max(1,msgs.length)]||'사랑하고 감사합니다.'}));s.push({big:'💌 감사 편지',cap:letter()});s.push({big:'❤️',cap:cfg.last});return s}
function stopMovie(){if(movieTimer){clearInterval(movieTimer);movieTimer=null}if(movieAudio){movieAudio.pause();movieAudio.currentTime=0;movieAudio=null}}
function movieSceneAt(sec,ss){let slot=30/ss.length;return Math.min(ss.length-1,Math.floor(sec/slot))}
function renderMovieFrame(idx,ss){let s=ss[idx],stage=document.getElementById('movieStage');if(!stage)return;stage.innerHTML=`${s.img?`<img src="${s.img}">`:''}<div class="movieContent"><div class="movieBig">${esc(s.big||'')}</div><div class="movieCaption">${esc(s.cap||'')}</div></div><div class="movieTime" id="movieTime">0:00 / 0:30</div>`}
function playMovie(){stopMovie();let ss=scenes(),stage=document.getElementById('movieStage'),wrap=document.getElementById('movieWrap');wrap.classList.add('playing');renderMovieFrame(0,ss);movieStart=performance.now();if(audioURL){movieAudio=new Audio(audioURL);movieAudio.play().catch(()=>{})}let last=-1;movieTimer=setInterval(()=>{let sec=Math.min(30,(performance.now()-movieStart)/1000),idx=movieSceneAt(sec,ss);if(idx!==last){renderMovieFrame(idx,ss);last=idx}let tm=document.getElementById('movieTime');if(tm)tm.textContent=`0:${String(Math.floor(sec)).padStart(2,'0')} / 0:30`;if(sec>=30){stopMovie();wrap.classList.remove('playing');renderMovieFrame(ss.length-1,ss);let tm2=document.getElementById('movieTime');if(tm2)tm2.textContent='0:30 / 0:30';celebrate()}},100)}

async function saveMovie(){
  if(!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream){alert('이 브라우저에서는 영상 저장을 지원하지 않아요. Chrome 또는 Edge 최신 버전을 사용해 주세요.');return}
  stopMovie();
  const btn=document.getElementById('saveMovie'), status=document.getElementById('saveStatus'), dl=document.getElementById('downloadMovie');
  btn.disabled=true; btn.textContent='⏳ 영상 만드는 중...'; if(dl)dl.style.display='none'; status.textContent='30초 영상을 만들고 있어요. 잠시 기다려 주세요.';
  try{
    const W=1280,H=720,canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');
    const ss=scenes(), cache={};
    await Promise.all(ss.filter(x=>x.img).map(x=>new Promise(res=>{let im=new Image();im.onload=()=>{cache[x.img]=im;res()};im.onerror=res;im.src=x.img})));
    const stream=canvas.captureStream(30); let audioEl=null,audioCtx=null;
    if(audioURL){try{audioEl=new Audio(audioURL);audioCtx=new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();let src=audioCtx.createMediaElementSource(audioEl),dest=audioCtx.createMediaStreamDestination();src.connect(dest);src.connect(audioCtx.destination);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t))}catch(e){console.warn('오디오 포함 실패:',e);audioEl=null}}
    let mime='video/webm;codecs=vp9,opus';if(!MediaRecorder.isTypeSupported(mime))mime='video/webm;codecs=vp8,opus';if(!MediaRecorder.isTypeSupported(mime))mime='video/webm';
    let parts=[];const mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:5000000});
    mr.ondataavailable=e=>{if(e.data&&e.data.size)parts.push(e.data)};
    const stopped=new Promise((resolve,reject)=>{mr.onstop=resolve;mr.onerror=e=>reject(e.error||e)});
    const drawText=(text,y,size,maxWidth)=>{ctx.font=`900 ${size}px system-ui, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='white';ctx.shadowColor='rgba(0,0,0,.65)';ctx.shadowBlur=14;let lines=[];String(text||'').split('\n').forEach(par=>{let words=par.split(' '),line='';for(let w of words){let test=line?line+' '+w:w;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=w}else line=test}lines.push(line)});let lh=size*1.35,start=y-(lines.length-1)*lh/2;lines.forEach((l,i)=>ctx.fillText(l,W/2,start+i*lh));ctx.shadowBlur=0};
    function draw(sec){let idx=movieSceneAt(sec,ss),sc=ss[idx];ctx.fillStyle='#382d32';ctx.fillRect(0,0,W,H);if(sc.img&&cache[sc.img]){let im=cache[sc.img],scale=Math.max(W/im.width,H/im.height)*(1+0.035*((sec%(30/ss.length))/(30/ss.length))),dw=im.width*scale,dh=im.height*scale;ctx.drawImage(im,(W-dw)/2,(H-dh)/2,dw,dh);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(0,0,0,.05)');g.addColorStop(1,'rgba(0,0,0,.58)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}if(sc.big)drawText(sc.big,H*.38,72,W*.86);drawText(sc.cap,H*.68,46,W*.84)}
    draw(0);mr.start(250);if(audioEl){audioEl.currentTime=0;await audioEl.play().catch(()=>{})}
    const started=performance.now();
    await new Promise(resolve=>{function frame(){let sec=Math.min(30,(performance.now()-started)/1000);draw(sec);status.textContent=`영상 만드는 중... ${Math.floor(sec)} / 30초`;if(sec<30)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});
    if(audioEl)audioEl.pause();
    if(mr.state!=='inactive')mr.stop();
    await stopped;
    if(audioCtx)await audioCtx.close().catch(()=>{});stream.getTracks().forEach(t=>t.stop());
    if(!parts.length)throw new Error('녹화된 영상 데이터가 없습니다.');
    const blob=new Blob(parts,{type:mime});
    if(downloadURL)URL.revokeObjectURL(downloadURL);downloadURL=URL.createObjectURL(blob);
    const download=document.getElementById('downloadMovie');
    download.href=downloadURL;download.download='어버이날_감사영상.webm';download.style.display='inline-block';
    status.textContent='✅ 영상이 완성됐어요! 아래 「완성 영상 다운로드」 버튼을 눌러 저장하세요.';
    btn.textContent='🔄 영상 다시 만들기';celebrate();
  }catch(e){console.error(e);status.textContent='⚠️ 영상 만들기에 실패했어요. Chrome 또는 Edge에서 다시 시도해 주세요.';btn.textContent='💾 완성 영상 만들기';alert('영상 생성 중 오류가 발생했어요.\n'+(e.message||e));}
  finally{btn.disabled=false}
}

function step4(){stopMovie();let ss=scenes(),s=ss[storyIndex];panel.innerHTML=`<h2>🎬 감사 영상 미리보기</h2><p class="hint">장면을 확인하거나, 아래 버튼으로 약 30초 동안 사진과 목소리가 자동으로 넘어가는 영상을 재생해보세요.</p><div class="story">${s.img?`<img src="${s.img}">`:`<div class="big">${esc(s.big||'')}</div>`}<div class="caption">${esc(s.cap||'')}</div></div><div class="nav"><button class="btn secondary" id="prevScene">${storyIndex?'◀ 이전 장면':'◀ 사진 수정'}</button><button class="btn secondary" id="nextScene">${storyIndex<ss.length-1?'다음 장면 ▶':'처음 장면 ↺'}</button></div><hr style="border:0;border-top:2px solid #f0e5e2;margin:28px 0"><h2>🎞️ 진짜 영상처럼 재생하기</h2><div class="movieWrap" id="movieWrap"><div class="movie" id="movieStage"></div><div class="movieProgress"><div></div></div><div class="movieControls"><button class="btn primary" id="playMovie">▶ 30초 영상 재생</button><button class="btn secondary" id="stopMovie">⏹ 멈추기</button><button class="btn primary" id="saveMovie">💾 완성 영상 만들기</button><a class="btn primary" id="downloadMovie" href="#" download="어버이날_감사영상.webm" style="display:none;text-decoration:none">⬇ 완성 영상 다운로드</a></div><p class="movieNote">학생이 녹음한 목소리가 있으면 영상 시작과 함께 자동 재생됩니다. 사진은 장면에 맞춰 자동으로 전환됩니다.</p><p class="saveStatus" id="saveStatus"></p></div><div class="nav"><button class="btn secondary" id="backEdit">◀ 사진·목소리 수정</button><button class="btn primary" id="finish">완성하기 🌷</button></div>`;renderMovieFrame(0,ss);if(downloadURL){let d=document.getElementById('downloadMovie');d.href=downloadURL;d.style.display='inline-block';document.getElementById('saveStatus').textContent='✅ 완성된 영상이 준비되어 있어요. 다운로드할 수 있습니다.';}document.getElementById('prevScene').onclick=()=>{if(storyIndex>0){storyIndex--;step4()}else{step=2;render()}};document.getElementById('nextScene').onclick=()=>{storyIndex=storyIndex<ss.length-1?storyIndex+1:0;step4()};document.getElementById('playMovie').onclick=playMovie;document.getElementById('saveMovie').onclick=saveMovie;document.getElementById('stopMovie').onclick=()=>{stopMovie();document.getElementById('movieWrap').classList.remove('playing')};document.getElementById('backEdit').onclick=()=>{stopMovie();step=2;render()};document.getElementById('finish').onclick=()=>{stopMovie();step=4;render();celebrate();speak('멋지게 완성했어요!')}}
function done(){panel.innerHTML=`<div class="done"><div class="flower">🌷💗🌷</div><h2>감사 영상 준비 완료!</h2><p class="letter">부모님께 사랑하는 마음을 전해보세요.</p><button class="btn primary" id="restart">🎬 처음부터 다시 만들기</button></div>`;document.getElementById('restart').onclick=()=>{step=0;selected=[];customThanks='';customClosing='';photos=[];storyIndex=0;if(audioURL)URL.revokeObjectURL(audioURL);audioURL='';render()}}
function celebrate(){for(let i=0;i<36;i++){let e=document.createElement('div');e.className='confetti';e.textContent=['🌸','💗','🌷','✨'][i%4];e.style.left=Math.random()*100+'vw';e.style.animationDuration=(2.5+Math.random()*3)+'s';e.style.animationDelay=(Math.random()*1.2)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),6500)}}
const modal=document.getElementById('teacherModal');document.getElementById('teacherBtn').onclick=()=>{document.getElementById('editor').innerHTML=`<h3>감사 문장</h3>${cfg.thanks.map((x,i)=>`<div class="row"><input class="input editThanks" value="${esc(x)}"><button class="btn secondary delT" data-i="${i}">삭제</button></div>`).join('')}<button class="btn secondary" id="addT">+ 문장 추가</button><h3>마지막 인사 선택지</h3>${cfg.closings.map(x=>`<input class="input editClose" value="${esc(x)}">`).join('')}<h3>첫 문장</h3><input class="input" id="editOpening" value="${esc(cfg.opening)}"><h3>영상 마지막 문구</h3><textarea class="input" id="editLast" rows="3">${esc(cfg.last)}</textarea>`;modal.classList.add('open');document.getElementById('addT').onclick=()=>{cfg.thanks.push('새 감사 문장을 입력하세요.');modal.classList.remove('open');document.getElementById('teacherBtn').click()};document.querySelectorAll('.delT').forEach(b=>b.onclick=()=>{cfg.thanks.splice(+b.dataset.i,1);modal.classList.remove('open');document.getElementById('teacherBtn').click()})};document.getElementById('closeTeacher').onclick=()=>modal.classList.remove('open');document.getElementById('saveTeacher').onclick=()=>{cfg.thanks=[...document.querySelectorAll('.editThanks')].map(x=>x.value.trim()).filter(Boolean);cfg.closings=[...document.querySelectorAll('.editClose')].map(x=>x.value.trim()).filter(Boolean);cfg.opening=document.getElementById('editOpening').value.trim()||defaults.opening;cfg.last=document.getElementById('editLast').value.trim()||defaults.last;localStorage.setItem('parentsThanksCfg',JSON.stringify(cfg));closing=cfg.closings[0]||'';modal.classList.remove('open');alert('문구를 저장했어요. 새로고침해도 유지돼요.');render()};render();
</script></body></html>
